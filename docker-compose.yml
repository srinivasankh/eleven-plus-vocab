# Local Postgres for development: `docker compose up -d`
# Data lives in the `pgdata` volume, so it survives `docker compose down`
# (use `docker compose down -v` to wipe it).
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: wordspark
      POSTGRES_PASSWORD: wordspark
      POSTGRES_DB: wordspark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordspark -d wordspark"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
